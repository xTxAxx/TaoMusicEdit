# pytest 配置：限定测试收集范围（src/detector / src/trimmer / src/webui/tests），
# 避免递归进入 src/webui/_vendor（vendored 依赖自带的测试会与系统安装的同名包冲突）。
# pythonpath = src 使测试可直接 import detector / trimmer / webui（pytest >= 7）。
[pytest]
testpaths =
    src/detector
    src/trimmer
    src/webui/tests
pythonpath = src
norecursedirs =
    .*
    build
    dist
    _vendor
    node_modules
    __pycache__
