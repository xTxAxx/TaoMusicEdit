<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaoMusicEdit · 视频检测与裁剪工作台</title>
<link rel="stylesheet" href="/static/css/style.css?v=31">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">Tao</span>
    <div class="brand-text">
      <h1>TaoMusicEdit</h1>
      <p>视频检测与裁剪工作台 · detector + trimmer</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="top-status" id="topStatus">就绪</span>
  </div>
</header>

<div class="layout">

  <!-- ============ 左侧边栏 ============ -->
  <aside class="sidebar" id="sidebar">

    <section class="card">
      <div class="card-head"><h2>路径与输出</h2></div>
      <div class="path-label">工作目录</div>
      <div class="path-row">
        <input type="text" id="workspacePath" placeholder="输入工作目录路径" autocomplete="off" spellcheck="false">
        <button class="btn" id="workspaceBrowse" title="打开目录浏览弹窗">浏览</button>
        <button class="btn primary" id="workspaceLoad">载入</button>
      </div>
      <div class="info-line" id="workspaceInfo"></div>
      <div class="path-label">输出目录</div>
      <div class="path-row">
        <input type="text" id="outputPath" placeholder="输出目录" autocomplete="off" spellcheck="false">
        <button class="btn" id="outputBrowse" title="打开目录浏览弹窗">浏览</button>
      </div>
      <div class="info-line" id="outputInfo"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>颜色检测</h2></div>
      <div class="params" id="detectParams"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>视频裁剪</h2></div>
      <div class="params" id="trimParams"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>批处理与缓存</h2></div>

      <section class="param-group">
        <div class="param-group-head static">
          <span class="param-group-title">批处理</span>
          <span class="param-group-count">2</span>
        </div>
        <div class="param-group-body">
          <div class="param-row" data-key="batch_workers" title="0 表示自动（按 CPU 核数，封顶 16）；过高会占用大量磁盘与 CPU">
            <label class="param-label" for="param-batch_workers">并发数</label>
            <div class="param-ctl">
              <input type="number" id="param-batch_workers" min="0" max="16" step="1" placeholder="0">
            </div>
            <div class="param-desc">批量任务同时执行的个数</div>
          </div>
          <label class="chk skip-cached-row" title="批量检测时自动跳过缓存库中已有有效结果的视频">
            <input type="checkbox" id="skipCached"> 跳过已缓存项
          </label>
        </div>
      </section>

      <section class="param-group">
        <div class="param-group-head static">
          <span class="param-group-title">检测结果缓存</span>
          <span class="param-group-count">2</span>
        </div>
        <div class="param-group-body">
          <div class="param-row" data-key="cache_enabled" title="开启后刷新页面 / 重启服务仍会自动匹配上次检测结果，无需重新检测。默认开启">
            <label class="param-label" for="param-cache_enabled">缓存开关</label>
            <div class="param-ctl">
              <input type="checkbox" id="param-cache_enabled" class="bool-input">
            </div>
            <div class="param-desc">检测结果的持久化保存</div>
          </div>
          <div class="param-row" data-key="cache_limit" title="超出上限自动淘汰最旧的条目；0 表示不限">
            <label class="param-label" for="param-cache_limit">条目上限</label>
            <div class="param-ctl">
              <input type="number" id="param-cache_limit" min="0" step="10" placeholder="0">
            </div>
            <div class="param-desc">缓存保留的条数上限</div>
          </div>
          <div class="cache-stats muted-text" id="cacheStats"></div>
          <div class="cache-actions">
            <button class="btn small" id="btnRefreshCacheStats"
                    title="重新读取缓存条目数量">刷新统计</button>
            <button class="btn small" id="btnPruneCache"
                    title="删除源文件已丢失、已修改或结果损坏的缓存条目">清理失效条目</button>
            <button class="btn small danger" id="btnClearCache"
                    title="删除全部检测结果缓存条目">清空缓存</button>
          </div>
        </div>
      </section>
    </section>

    <div class="sidebar-foot">
      <button class="btn subtle" id="resetSettings"
              title="删除配置文件，将工作区、输出目录及全部参数恢复为默认值">↺ 恢复默认设置</button>
    </div>

  </aside>

  <!-- ============ 主内容 ============ -->
  <main class="main">

    <section class="card player-card">
      <div class="player-stage" id="playerStage">
        <video id="video" preload="metadata" playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="player-hud" id="playerHud"></div>
        <div class="loading-mask" id="playerLoading" hidden>正在加载视频…</div>
      </div>

      <div class="player-controls">
        <div class="timeline">
          <div class="scrubber" id="scrubber" title="拖动跳转进度；按住 Ctrl 滚动滚轮缩放时间轴；双击恢复全览">
            <canvas class="scrub-wave" id="scrubWave"></canvas>
            <div class="scrub-fill" id="scrubFill"></div>
            <div class="scrub-marks" id="scrubMarks"></div>
            <div class="scrub-thumb" id="scrubThumb"></div>
          </div>
          <div class="zoom-scroll" id="zoomScroll" title="拖动或点击以平移时间轴可见范围">
            <div class="zoom-view" id="zoomView"></div>
          </div>
        </div>
        <div class="transport">
          <button class="ctl" id="btnPrev" title="上一帧（←）">上一帧</button>
          <button class="ctl play" id="btnPlay" title="播放/暂停（空格）">播放</button>
          <button class="ctl" id="btnNext" title="下一帧（→）">下一帧</button>
          <button class="ctl" id="btnDetect" title="执行颜色检测">检测</button>
          <button class="ctl" id="btnTrim" title="按裁剪起点执行裁剪">裁剪</button>
          <button class="ctl" id="btnSetAsStart" title="将当前播放帧设为裁剪起点（按起点方式自动取帧序号或时间戳）">设为起点</button>
          <button class="ctl" id="btnSetAsEnd" title="将当前播放帧设为裁剪终点（按终点方式自动取帧序号或时间戳；终点方式为「无」时沿用起点方式）">设为终点</button>
          <label class="chk"><input type="checkbox" id="markerToggle" checked> 显示检测标记</label>
          <span class="spacer"></span>
          <span id="frameInfo" class="muted-text">帧 - / -</span>
        </div>
        <div class="meta-line">
          <span id="videoMeta" class="muted-text"></span>
          <span id="timecode">00:00:00.000 / 00:00:00.000</span>
        </div>
        <div class="meta-line">
          <span id="startBadge" class="start-badge"></span>
          <span id="endBadge" class="end-badge"></span>
        </div>
      </div>
    </section>

    <!-- ============ 任务中心 ============ -->
    <div class="task-panels">
      <section class="card task-panel" id="panelTaskDetect">
        <div class="card-head">
          <h2>颜色检测</h2>
          <div class="task-tools" data-col="detect">
            <div class="task-chips">
              <button type="button" class="chip active" data-filter="all">全部</button>
              <button type="button" class="chip" data-filter="running">运行中</button>
              <button type="button" class="chip" data-filter="done">成功</button>
              <button type="button" class="chip" data-filter="fail">失败</button>
            </div>
          </div>
        </div>
        <div class="task-total">
          <div class="task-total-bar"><div class="progress-fill" id="detectTotalFill"></div></div>
          <span class="task-total-label" id="detectTotalLabel"></span>
          <button type="button" class="btn small" data-clear
                  title="清空已成功与失败的任务">清空</button>
        </div>
        <div class="task-list" id="detectTaskList">
          <div class="task-empty" id="detectTaskEmpty">暂无任务：选择视频后点击「检测」或「批量检测」</div>
        </div>
      </section>

      <section class="card task-panel" id="panelTaskTrim">
        <div class="card-head">
          <h2>视频裁剪</h2>
          <div class="task-tools" data-col="trim">
            <div class="task-chips">
              <button type="button" class="chip active" data-filter="all">全部</button>
              <button type="button" class="chip" data-filter="running">运行中</button>
              <button type="button" class="chip" data-filter="done">成功</button>
              <button type="button" class="chip" data-filter="fail">失败</button>
            </div>
          </div>
        </div>
        <div class="task-total">
          <div class="task-total-bar"><div class="progress-fill" id="trimTotalFill"></div></div>
          <span class="task-total-label" id="trimTotalLabel"></span>
          <button type="button" class="btn small" data-clear
                  title="清空已成功与失败的任务">清空</button>
        </div>
        <div class="task-list" id="trimTaskList">
          <div class="task-empty" id="trimTaskEmpty">暂无任务：选择视频后点击「裁剪」或「批量裁剪」</div>
        </div>
      </section>
    </div>

  </main>

  <!-- ============ 右侧边栏：文件选择 ============ -->
  <aside class="wsbar" id="wsbar">

    <section class="card ws-card">
      <div class="card-head"><h2>文件选择</h2></div>
      <div class="sel-toolbar">
        <button class="btn small" id="btnSelectAll" title="全选当前工作区的视频文件">全选</button>
        <button class="btn small" id="btnClearSel" title="清空选择">清空</button>
        <span class="sel-count" id="selCount">已选 0</span>
      </div>
      <div class="batch-toolbar">
        <button class="btn small primary" id="btnBatchDetect" title="对选中的视频批量执行颜色检测">批量检测</button>
        <button class="btn small primary" id="btnBatchTrim" title="按批量检测结果对选中的视频批量裁剪">批量裁剪</button>
      </div>
      <div class="file-tree" id="fileTree">
        <div class="placeholder">尚未加载工作区</div>
      </div>
    </section>

  </aside>
</div>

<!-- ============ 目录浏览弹窗 ============ -->
<div class="modal-mask" id="dirModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="dirModalTitle">选择目录</h3>
      <button class="icon-btn" data-close title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="dir-current" id="dirCurrent"></div>
      <div class="dir-list" id="dirList"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="dirChoose">选择当前目录</button>
    </div>
  </div>
</div>

<script src="/static/js/params.js?v=15"></script>
<script src="/static/js/player.js?v=12"></script>
<script src="/static/js/app.js?v=41"></script>
</body>
</html>
